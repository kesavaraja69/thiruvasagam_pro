version: '3.8'

services:
  songs-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thiruvasagam-songs
    ports:
      - "8080:80"
    volumes:
      # Mount songs directory for live updates without rebuilding
      - ./songs:/usr/share/nginx/html/songs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
