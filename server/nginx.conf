server {
    listen 80;
    server_name localhost;

    # Root directory for songs
    root /usr/share/nginx/html/songs;

    # Enable directory listing
    autoindex on;

    # Default location
    location / {
        # Enable CORS for cross-origin requests
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Cache static assets
        location ~* \.(mp3|wav|ogg|m4a|aac|flac)$ {
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Health check endpoint
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # List songs endpoint (JSON)
    location = /api/songs {
        alias /usr/share/nginx/html/songs/;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        autoindex on;
        autoindex_format json;
    }
}
